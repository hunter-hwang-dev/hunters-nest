    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>

    <div
      class="container"
      id="sticker"
      draggable="true"
      ondragstart="drag(event)"
    >
      <img id="sticker00" src="sticker00.svg" />
      <div class="text">여기에 글자 입력</div>
    </div>

    <style>
      .container {
        position: relative; /* 부모 요소의 위치를 상대적으로 설정 */
        width: 200px; /* 컨테이너 크기 */
        height: 200px; /* 컨테이너 크기 */
      }

      #sticker00 {
        width: 100%; /* 이미지 크기 맞춤 */
        height: 100%; /* 이미지 크기 맞춤 */
        display: block; /* 이미지 아래 여백 제거 */
      }

      .text {
        position: absolute; /* 텍스트를 이미지 위에 절대 위치로 배치 */
        top: 50%; /* 상하 중앙 */
        left: 50%; /* 좌우 중앙 */
        transform: translate(-50%, -50%); /* 정확한 중앙 정렬 */
        color: white;
        font-size: 20px;
        font-weight: bold;
        z-index: 1; /* 텍스트가 이미지 위에 오도록 */
      }
    </style>

    <script>
      function drag(ev) {
        ev.dataTransfer.setData("text", ev.target.id);
      }

      document.addEventListener("dragover", function (event) {
        event.preventDefault();
      });

      document.addEventListener("drop", function (event) {
        event.preventDefault();
        var data = event.dataTransfer.getData("text"); // 드래그된 요소의 ID 가져오기
        var draggedElement = document.getElementById(data); // ID를 사용하여 드래그된 요소 가져오기

        // 마우스 좌표 가져오기
        var mouseX = event.clientX;
        var mouseY = event.clientY;

        // 드래그된 요소를 마우스 좌표에 위치시키기
        draggedElement.style.left =
          mouseX - draggedElement.offsetWidth / 2 + "px";
        draggedElement.style.top =
          mouseY - draggedElement.offsetHeight / 2 + "px";

        // 드래그된 요소를 body에 추가하기
        document.body.appendChild(draggedElement);
      });
    </script>
  </body>
</html>
