<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link href="sticker.css" rel="stylesheet" />
  </head>
  <body class="sketch">
    <button id="save" class="btn">이 스케치 저장하기</button>
    <button id="xy" class="btn">좌표 찾기 테스트</button>

    <div
      id="0"
      class="sticker-container"
      draggable="true"
      ondragstart="drag(event)"
    >
      <div class="sticker" draggable="false">
        <div class="sticker-memo" draggable="false" contenteditable="true">
          여기에 입력
        </div>
        <img class="sticker-img" src="svg/sticker00.svg" draggable="false" />
      </div>
    </div>

    <div
      id="1"
      class="sticker-container"
      draggable="true"
      ondragstart="drag(event)"
    >
      <div class="sticker" draggable="false">
        <div class="sticker-memo" draggable="false" contenteditable="true">
          여기에 입력
        </div>
        <img
          class="sticker-image"
          style="position: absolute"
          src="svg/sticker01.svg"
          draggable="false"
        />
      </div>
    </div>

    <div
      id="2"
      class="sticker-container"
      draggable="true"
      ondragstart="drag(event)"
    >
      <div class="sticker" draggable="false">
        <div class="sticker-memo" draggable="false" contenteditable="true">
          여기에 입력
        </div>
        <img
          class="sticker-image"
          style="position: absolute"
          src="svg/sticker02.svg"
          draggable="false"
        />
      </div>
    </div>

    <div id="hover" class="hover">
      <img
        id="stickerpack-blue-00"
        class="sticker-sample"
        src="svg/sticker00.svg"
        draggable="true"
        ondragstart="dragSample(event)"
      />
      <img
        id="stickerpack-blue-01"
        class="sticker-sample"
        src="svg/sticker01.svg"
        draggable="true"
        ondragstart="dragSample(event)"
      />
      <img
        id="stickerpack-blue-02"
        class="sticker-sample"
        src="svg/sticker02.svg"
        draggable="true"
        ondragstart="dragSample(event)"
      />
    </div>
    <script type="module" src="sticker.js"></script>
  </body>
</html>
