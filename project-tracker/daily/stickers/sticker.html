<!DOCTYPE html>
<html lang="en">

    <meta charset="UTF-8" />

  </head>
  <body>
    <style>
      img {
        /* position: absolute;
        cursor: move; */
        filter: drop-shadow(rgba(61, 58, 53, 0.753) 0rem 0.25rem 0.1rem);
      }
    </style>

    <div
      style="position: absolute"
      id="sticker00"
      draggable="true"
      ondragstart="drag(event)"
    >
      <div style="position: relative" draggable="false">
        <input
          type="text"
          draggable="false"
          style="text-align: center; position: absolute; z-index: 1"
        />
        <img style="position: absolute" src="sticker00.svg" draggable="false" />
      </div>
    </div>

    <script>
      function drag(ev) {
        console.log(ev.target.id);
        ev.dataTransfer.setData("text", ev.target.id);
      }

      document.addEventListener("dragover", function (event) {
        event.preventDefault();
      });

      document.addEventListener("drop", function (event) {
        event.preventDefault();
        console.log(event);

        var data = event.dataTransfer.getData("text"); // 드래그된 요소의 ID 가져오기
        var draggedElement = document.getElementById(data); // ID를 사용하여 드래그된 요소 가져오기

        // 마우스 좌표 가져오기
        var mouseX = event.clientX;
        var mouseY = event.clientY;

        // 드래그된 요소를 마우스 좌표에 위치시키기
        draggedElement.style.left =
          mouseX - draggedElement.offsetWidth / 2 + "px";
        draggedElement.style.top =
          mouseY - draggedElement.offsetHeight / 2 + "px";

        // 드래그된 요소를 body에 추가하기
        document.body.appendChild(draggedElement);
      });
    </script>
  </body>
</html>
