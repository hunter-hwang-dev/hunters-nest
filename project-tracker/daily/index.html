<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Daily</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header style="text-align: center">
      <h3>제목!</h3>
      <p>
        목표: 프로젝트 트래킹할 수 있는 view-only 페이지 만들기 (개발
        블로그에기능 끼워넣으려고)
      </p>
      <p>기간: 2025-02-14 ~ 2025-03-14 한 달 동안</p>
    </header>
    <h4 id="date">2025년 2월 19일 수요일</h4>
    <div class="day">
      <div class="daily todo">
        <ul id="list">
          <li>
            <input type="checkbox" name="1" /><label for="1"
              >데일리 페이지에 필요한 tag 생각해 죽 적어두기</label
            >
          </li>
          <li>
            <input type="checkbox" name="2" /><label for="2"
              >html + css로 레이아웃 잡기</label
            >
          </li>
          <li>
            <input type="checkbox" name="3" /><label for="3"
              >css로 꾸미기</label
            >
          </li>
        </ul>
      </div>
      <div class="daily sketch" id="drop-zone"></div>
      <div class="sticker" draggable="true"></div>
    </div>

    <script>
      const stickers = document.getElementsByClassName("sticker"); //웹에서 스티커 추가 시에 갱신 안됨 주의
      const dropZone = document.getElementById("drop-zone");

      stickers[0].addEventListener("drastart", function (event) {
        console.log(event);
      });

      dropZone.addEventListener("dragover", function (event) {
        event.preventDefault();
      });

      dropZone.addEventListener("drop", function (event) {
        dropZone.prepend(stickers[0]);
      });
    </script>
  </body>
</html>
