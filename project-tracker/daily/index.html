<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Daily</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <style>
      .box {
        background-color: green;
        width: 100px;
        height: 100px;
        position: absolute;
      }
    </style>
    <div id="box" class="box" draggable="true" ondragstart="drag(event)">
      <p contenteditable="true"></p>
    </div>

    <header style="text-align: center">
      <h3>제목!</h3>
      <p>
        목표: 프로젝트 트래킹할 수 있는 view-only 페이지 만들기 (개발
        블로그에기능 끼워넣으려고)
      </p>
      <p>기간: 2025-02-14 ~ 2025-03-14 한 달 동안</p>
    </header>

    <h4 id="date">2025년 2월 19일 수요일</h4>

    <div class="day">
      <div class="daily todo">
        <ul id="list">
          <li>
            <input type="checkbox" name="1" /><label for="1"
              >데일리 페이지에 필요한 tag 생각해 죽 적어두기</label
            >
          </li>
          <li>
            <input type="checkbox" name="2" /><label for="2"
              >html + css로 레이아웃 잡기</label
            >
          </li>
          <li>
            <input type="checkbox" name="3" /><label for="3"
              >css로 꾸미기</label
            >
          </li>
        </ul>
      </div>
      <div class="daily sketch" id="drop-zone">
        <div class="sticker" draggable="true"></div>
      </div>
    </div>
    <div class="sticker" draggable="true"></div>
    <script src="script.js"></script>
  </body>
</html>
